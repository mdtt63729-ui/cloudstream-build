name: Build CloudStream APK

# Builds upstream CloudStream (recloudstream/cloudstream), replaces the launcher icon with the
# artwork in assets/icons, and signs the stable release APK.
# The signing keystore is reused from repository secrets so rebuilds keep the same signature.

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and sign CloudStream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CloudStream
        uses: actions/checkout@v4
        with:
          repository: recloudstream/cloudstream
          ref: master
          fetch-depth: 1

      - name: Checkout icon assets
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Apply app icon
        run: |
          set -euo pipefail
          R=app/src/main/res
          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "overlay/assets/icons/ic_launcher-$dens.png" "$R/mipmap-$dens/ic_launcher.png"
            cp "overlay/assets/icons/ic_launcher_round-$dens.png" "$R/mipmap-$dens/ic_launcher_round.png"
            cp "overlay/assets/icons/ic_launcher_foreground-$dens.png" "$R/mipmap-$dens/ic_launcher_foreground.png"
          done
          cp overlay/assets/icons/ic_launcher-playstore.png app/src/main/ic_launcher-playstore.png
          cp overlay/assets/icons/ic_launcher.xml "$R/mipmap-anydpi-v26/ic_launcher.xml"
          cp overlay/assets/icons/ic_launcher_round.xml "$R/mipmap-anydpi-v26/ic_launcher_round.xml"
          cp overlay/assets/icons/cineflow_icon.xml "$R/values/cineflow_icon.xml"
          echo "Launcher icon replaced with the supplied artwork."

      - name: Apply UI customisation
        run: python3 overlay/assets/patch_ui.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" \
            || sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" \
            || echo "SDK 37 not preinstalled; Gradle will try to download it"

      - name: Build stable release APK
        run: ./gradlew :app:assembleStableRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          find app/build/outputs -name '*.apk' -print
          APK="$(find app/build/outputs -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          cp "$APK" "$RUNNER_TEMP/cloudstream-unsigned.apk"

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/cloudstream.keystore"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Using the stored keystore."
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            STORE_PASS="$SECRET_STORE_PASS"
            KEY_ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASS="$SECRET_KEY_PASS"
          else
            echo "No stored keystore; generating a new one."
            STORE_PASS="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 24)"
            KEY_ALIAS="cloudstream"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v -keystore "$KS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=CloudStream, OU=Mobile, O=CineFlow, C=IN"
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
            --out "$RUNNER_TEMP/CloudStream-stable-release-signed.apk" \
            "$RUNNER_TEMP/cloudstream-unsigned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/CloudStream-stable-release-signed.apk"
          printf "SIGNING_KEYSTORE_BASE64=%s\nSIGNING_STORE_PASSWORD=%s\nSIGNING_KEY_ALIAS=%s\nSIGNING_KEY_PASSWORD=%s\n" \
            "$(base64 -w0 "$KS")" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > "$RUNNER_TEMP/signing-secrets.env"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-signed
          path: |
            ${{ runner.temp }}/CloudStream-stable-release-signed.apk
            ${{ runner.temp }}/signing-secrets.env
          if-no-files-found: error
          retention-days: 14
