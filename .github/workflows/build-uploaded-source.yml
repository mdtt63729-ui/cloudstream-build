name: Build uploaded source

# Compiles the source archive exactly as uploaded. The only edits are the version
# bump and the two compile fixes needed to make the archive build at all.

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL of the source zip"
        required: false
        default: "https://github.com/mdtt63729-ui/cloudstream-build/releases/download/v4.8.36-source/PrimeBox-source.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build uploaded source
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source archive
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.source_url }}"
          if [ -z "$URL" ]; then
            URL="https://github.com/mdtt63729-ui/cloudstream-build/releases/download/v4.8.36-source/PrimeBox-source.zip"
          fi
          curl -sL -o source.zip "$URL"
          ls -la source.zip
          mkdir -p src
          unzip -q source.zip -d src
          echo "--- project root ---"
          ls src

      - name: Initialise git metadata
        # CloudStream's build reads .git/HEAD to stamp the commit hash and the
        # archive has no repository inside it, so give it a minimal one.
        run: |
          set -euo pipefail
          cd src
          git init -q
          git add -A >/dev/null 2>&1 || true
          git -c user.email=build@local -c user.name=build commit -qm "source archive" || true
          test -f .git/HEAD && echo ".git/HEAD present"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" \
            || sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" \
            || echo "SDK 37 not preinstalled; Gradle will try to download it"

      - name: Fix the compile errors in the archive
        # The uploaded source does not compile as-is. These are the only edits
        # applied to it, and they exist solely to make it build.
        working-directory: src
        run: |
          python3 <<'PYEOF'
          import pathlib

          adapter = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/download/DownloadAdapter.kt")
          text = adapter.read_text(encoding="utf-8")
          old = "onItemClickEvent.invoke(DownloadClickEvent(this.itemId, data))"
          new = "onHeaderClickEvent.invoke(DownloadHeaderClickEvent(this.itemId, data))"
          if old in text:
              adapter.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("DownloadAdapter.kt: header menu emits DownloadHeaderClickEvent")

          fragment = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/download/DownloadFragment.kt")
          lines = fragment.read_text(encoding="utf-8").splitlines(keepends=True)
          kept = [
              line for line in lines
              if "downloadStreamButton?.shrink()" not in line
              and "downloadStreamButton?.extend()" not in line
          ]
          if len(kept) != len(lines):
              fragment.write_text("".join(kept), encoding="utf-8")
              print("DownloadFragment.kt: removed the shrink/extend calls")
          PYEOF

      - name: Add crash logger and defensive guards
        # Logs go to /storage/emulated/0/bomb/ when that folder is writable, and
        # always to the app's own external folder as a fallback. A heartbeat is
        # written on every launch so the folder is populated even with no crash.
        working-directory: src
        run: |
          python3 <<'PYEOF'
          import pathlib

          logger = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/pb/PbCrashLogger.kt")
          logger.parent.mkdir(parents=True, exist_ok=True)
          logger.write_text("""package com.lagradost.cloudstream3.ui.pb

          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import java.io.File
          import java.io.PrintWriter
          import java.io.StringWriter
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * Writes a heartbeat on every launch and the stack trace of any crash.
           *
           * Files are written to /storage/emulated/0/bomb/ and, when that folder is not
           * writable (scoped storage), to the app's own external folder as well.
           */
          object PbCrashLogger {
              private const val FOLDER = "bomb"

              fun install(context: Context) {
                  val app = context.applicationContext
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      runCatching { write(app, "crash", thread, error) }
                      previous?.uncaughtException(thread, error)
                  }
                  runCatching { write(app, "launch", Thread.currentThread(), null) }
              }

              fun note(context: Context, tag: String) {
                  runCatching { write(context.applicationContext, tag, Thread.currentThread(), null) }
              }

              private fun folders(context: Context): List<File> {
                  val list = ArrayList<File>()
                  list.add(File(Environment.getExternalStorageDirectory(), FOLDER))
                  context.getExternalFilesDir(null)?.let { list.add(File(it, FOLDER)) }
                  list.add(File(context.filesDir, FOLDER))
                  return list
              }

              private fun write(context: Context, tag: String, thread: Thread, error: Throwable?) {
                  val stamp = SimpleDateFormat("yyyyMMdd-HHmmss", Locale.US).format(Date())
                  val body = buildString {
                      appendLine("time: " + stamp)
                      appendLine("tag: " + tag)
                      appendLine("thread: " + thread.name)
                      appendLine("version: " + com.lagradost.cloudstream3.BuildConfig.VERSION_NAME)
                      appendLine("sdk: " + Build.VERSION.SDK_INT)
                      if (error != null) {
                          val buffer = StringWriter()
                          error.printStackTrace(PrintWriter(buffer))
                          appendLine()
                          append(buffer.toString())
                      }
                  }
                  for (folder in folders(context)) {
                      runCatching {
                          if (!folder.exists()) folder.mkdirs()
                          File(folder, tag + "-" + stamp + ".txt").writeText(body)
                      }
                  }
              }
          }
          """, encoding="utf-8")
          print("PbCrashLogger.kt written")

          main = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/MainActivity.kt")
          text = main.read_text(encoding="utf-8")
          anchor = "        CommonActivity.init(this)\\n"
          if "PbCrashLogger" not in text and anchor in text:
              text = text.replace(
                  anchor,
                  anchor + "        runCatching { com.lagradost.cloudstream3.ui.pb.PbCrashLogger.install(this) }\\n",
                  1,
              )
          for call in (
              "com.lagradost.cloudstream3.ui.pb.PbPreinstalled.seed(this)",
              "com.lagradost.cloudstream3.ui.pb.PbUpdater.checkAndOffer(this)",
          ):
              if "        " + call + "\\n" in text:
                  text = text.replace(
                      "        " + call + "\\n",
                      "        runCatching { " + call + " }\\n",
                      1,
                  )
          if "setupFloatingNavBar(navController)" in text and "runCatching { setupFloatingNavBar" not in text:
              text = text.replace(
                  "        setupFloatingNavBar(navController)\\n",
                  "        runCatching { setupFloatingNavBar(navController) }\\n",
                  1,
              )
          # a marker once the activity has finished starting, to see how far it gets
          if "pb-activity-created" not in text:
              text = text.replace(
                  "        runCatching { com.lagradost.cloudstream3.ui.pb.PbCrashLogger.install(this) }\\n",
                  "        runCatching { com.lagradost.cloudstream3.ui.pb.PbCrashLogger.install(this) }\\n"
                  "        runCatching { com.lagradost.cloudstream3.ui.pb.PbCrashLogger.note(this, \"pb-activity-created\") }\\n",
                  1,
              )
          main.write_text(text, encoding="utf-8")
          print("MainActivity.kt guarded and marked")

          manifest = pathlib.Path("app/src/main/AndroidManifest.xml")
          mtext = manifest.read_text(encoding="utf-8")
          if "MANAGE_EXTERNAL_STORAGE" not in mtext:
              perm = ('    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"\\n'
                      '        tools:ignore="ScopedStorage" />\\n')
              mtext = mtext.replace("<application", perm + "\\n    <application", 1)
          if "WRITE_EXTERNAL_STORAGE" not in mtext:
              perm2 = ('    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\\n'
                       '        android:maxSdkVersion="28" />\\n')
              mtext = mtext.replace("<application", perm2 + "\\n    <application", 1)
          if "xmlns:tools" not in mtext.split("<application")[0]:
              mtext = mtext.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\\n    xmlns:tools="http://schemas.android.com/tools"',
                  1,
              )
          manifest.write_text(mtext, encoding="utf-8")
          print("manifest: storage permissions added")
          PYEOF

      - name: Disable automatic update downloads
        # An update may only start when the user taps Download. The stock
        # CloudStream auto-updater is switched off so nothing downloads by itself.
        working-directory: src
        run: |
          python3 <<'PYEOF'
          import pathlib

          updater = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/utils/InAppUpdater.kt")
          text = updater.read_text(encoding="utf-8")
          old = "        if (checkAutoUpdate && !autoUpdateEnabled) {\n            return false\n        }\n"
          new = ("        // Prime Box: an automatic check must never download anything.\n"
                 "        if (checkAutoUpdate) {\n            return false\n        }\n")
          if old in text and "an automatic check must never download" not in text:
              updater.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("InAppUpdater.kt: automatic updates disabled")
          else:
              print("InAppUpdater.kt: already guarded or pattern missing")

          pref = pathlib.Path("shared/src/commonMain/kotlin/com/lagradost/cloudstream4/DevicePreferenceStore.kt")
          ptext = pref.read_text(encoding="utf-8")
          old_pref = 'val showAppUpdates = preferences.getBoolean("auto_update", true)'
          new_pref = 'val showAppUpdates = preferences.getBoolean("auto_update", false)'
          if old_pref in ptext:
              pref.write_text(ptext.replace(old_pref, new_pref, 1), encoding="utf-8")
              print("DevicePreferenceStore.kt: app update prompts default to off")
          PYEOF

      - name: Bump version
        working-directory: src
        run: |
          python3 <<'PYEOF'
          import pathlib, re, os
          path = pathlib.Path("gradle/libs.versions.toml")
          text = path.read_text(encoding="utf-8")
          # bump whatever the archive already carries, so the number keeps rising
          def bump_code(m):
              return 'versionCode = "%d"' % (int(m.group(1)) + 1)
          def bump_name(m):
              # the archive is always the same, so add the run number to keep rising
              run = int(os.environ.get("RUN_NUMBER", "0"))
              return 'versionName = "%s.%s.%d"' % (m.group(1), m.group(2), int(m.group(3)) + 1 + run)
          text = re.sub(r'^versionCode = "(\d+)"$', bump_code, text, count=1, flags=re.M)
          text = re.sub(r'^versionName = "(\d+)\.(\d+)\.(\d+)"$', bump_name, text, count=1, flags=re.M)
          path.write_text(text, encoding="utf-8")
          print("bumped to:")
          print("\n".join(l for l in text.splitlines() if l.startswith(("versionCode", "versionName"))))
          PYEOF
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Build stable release APK
        working-directory: src
        run: ./gradlew :app:assembleStableRelease --no-daemon --stacktrace

      - name: Collect APK
        working-directory: src
        run: |
          set -euo pipefail
          find app/build/outputs -name '*.apk' -print
          APK="$(find app/build/outputs -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          cp "$APK" "$RUNNER_TEMP/primebox-unsigned.apk"

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/primebox.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$SECRET_STORE_PASS" \
            --key-pass "pass:$SECRET_KEY_PASS" \
            --out "$RUNNER_TEMP/PrimeBox-signed.apk" "$RUNNER_TEMP/primebox-unsigned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/PrimeBox-signed.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeBox-uploaded-source
          path: ${{ runner.temp }}/PrimeBox-signed.apk
          if-no-files-found: error
          retention-days: 14
