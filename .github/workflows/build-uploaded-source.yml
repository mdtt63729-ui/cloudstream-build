name: Build uploaded source

# Compiles the source archive exactly as uploaded. The only edits are the version
# bump and the two compile fixes needed to make the archive build at all.

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL of the source zip"
        required: false
        default: "https://github.com/mdtt63729-ui/cloudstream-build/releases/download/v4.8.36-source/PrimeBox-source.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build uploaded source
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source archive
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.source_url }}"
          if [ -z "$URL" ]; then
            URL="https://github.com/mdtt63729-ui/cloudstream-build/releases/download/v4.8.36-source/PrimeBox-source.zip"
          fi
          curl -sL -o source.zip "$URL"
          ls -la source.zip
          mkdir -p src
          unzip -q source.zip -d src
          # some archives carry a single top-level folder; flatten it
          entries=$(ls -A src | wc -l)
          if [ "$entries" = "1" ] && [ -d "src/$(ls -A src)" ]; then
            inner="src/$(ls -A src)"
            echo "flattening $inner"
            shopt -s dotglob
            mv "$inner"/* src/
            rmdir "$inner"
            shopt -u dotglob
          fi
          test -f src/settings.gradle.kts || { echo "::error::no project at src root"; exit 1; }
          echo "--- project root ---"
          ls src

      - name: Initialise git metadata
        # CloudStream's build reads .git/HEAD to stamp the commit hash and the
        # archive has no repository inside it, so give it a minimal one.
        run: |
          set -euo pipefail
          cd src
          git init -q
          git add -A >/dev/null 2>&1 || true
          git -c user.email=build@local -c user.name=build commit -qm "source archive" || true
          test -f .git/HEAD && echo ".git/HEAD present"

      - name: Pre-seed the Gradle distribution
        # Try the mirrors first because Gradle's own client has been getting 504s.
        # If none answer, leave the wrapper alone and let Gradle try normally.
        working-directory: src
        run: |
          set -euo pipefail
          URL=$(grep -o 'https[^ ]*gradle-[0-9.]*-bin.zip' gradle/wrapper/gradle-wrapper.properties | head -n 1)
          VER=$(echo "$URL" | grep -o 'gradle-[0-9.]*-bin.zip' | sed 's/gradle-//; s/-bin.zip//')
          echo "version: $VER"
          ok=0
          for src in "$URL" \
                     "https://github.com/gradle/gradle-distributions/releases/download/v${VER}/gradle-${VER}-bin.zip" \
                     "https://downloads.gradle.org/distributions/gradle-${VER}-bin.zip"; do
            echo "trying $src"
            for attempt in 1 2 3; do
              curl -sL --retry 2 --retry-all-errors --retry-delay 5 -o /tmp/gradle-dist.zip "$src" || true
              size=$(stat -c %s /tmp/gradle-dist.zip 2>/dev/null || echo 0)
              echo "  attempt $attempt: $size bytes"
              if [ "$size" -gt 50000000 ]; then ok=1; break; fi
              sleep 6
            done
            [ "$ok" = "1" ] && break
          done
          if [ "$ok" = "1" ]; then
            python3 - <<'PYEOF'
          import pathlib, re
          path = pathlib.Path("gradle/wrapper/gradle-wrapper.properties")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'^distributionUrl=.*$', r'distributionUrl=file\\:/tmp/gradle-dist.zip', text, count=1, flags=re.M)
          path.write_text(text, encoding="utf-8")
          print("wrapper now uses the local distribution")
          PYEOF
          else
            echo "no mirror answered; letting Gradle fetch it itself"
          fi
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" \
            || sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" \
            || echo "SDK 37 not preinstalled; Gradle will try to download it"

      - name: Fix the compile errors in the archive
        # The uploaded source does not compile as-is. These are the only edits
        # applied to it, and they exist solely to make it build.
        working-directory: src
        run: |
          python3 <<'PYEOF'
          import pathlib

          adapter = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/download/DownloadAdapter.kt")
          text = adapter.read_text(encoding="utf-8")
          old = "onItemClickEvent.invoke(DownloadClickEvent(this.itemId, data))"
          new = "onHeaderClickEvent.invoke(DownloadHeaderClickEvent(this.itemId, data))"
          if old in text:
              adapter.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("DownloadAdapter.kt: header menu emits DownloadHeaderClickEvent")

          fragment = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/download/DownloadFragment.kt")
          lines = fragment.read_text(encoding="utf-8").splitlines(keepends=True)
          kept = [
              line for line in lines
              if "downloadStreamButton?.shrink()" not in line
              and "downloadStreamButton?.extend()" not in line
          ]
          if len(kept) != len(lines):
              fragment.write_text("".join(kept), encoding="utf-8")
              print("DownloadFragment.kt: removed the shrink/extend calls")
          PYEOF

      - name: Add crash logger and defensive guards
        # Logs go to /storage/emulated/0/bomb/ when that folder is writable, and
        # always to the app's own external folder as a fallback. A heartbeat is
        # written on every launch so the folder is populated even with no crash.
        working-directory: src
        run: |
          python3 <<'PYEOF'
          import pathlib

          logger = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/pb/PbCrashLogger.kt")
          logger.parent.mkdir(parents=True, exist_ok=True)
          logger.write_text("""package com.lagradost.cloudstream3.ui.pb

          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import java.io.File
          import java.io.PrintWriter
          import java.io.StringWriter
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * Writes a heartbeat on every launch and the stack trace of any crash.
           *
           * Files are written to /storage/emulated/0/bomb/ and, when that folder is not
           * writable (scoped storage), to the app's own external folder as well.
           */
          object PbCrashLogger {
              private const val FOLDER = "bomb"

              fun install(context: Context) {
                  val app = context.applicationContext
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      runCatching { write(app, "crash", thread, error) }
                      previous?.uncaughtException(thread, error)
                  }
                  runCatching { write(app, "launch", Thread.currentThread(), null) }
              }

              /** Opens the All files access screen once, so the top-level folder can be written. */
              fun ensureAccess(activity: android.app.Activity) {
                  if (Build.VERSION.SDK_INT < 30) return
                  val already = runCatching { Environment.isExternalStorageManager() }.getOrDefault(false)
                  if (already) return
                  val prefs = activity.getSharedPreferences("primebox_logs", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("asked", false)) return
                  prefs.edit().putBoolean("asked", true).apply()
                  runCatching {
                      val intent = android.content.Intent(
                          android.provider.Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                          android.net.Uri.parse("package:" + activity.packageName)
                      )
                      activity.startActivity(intent)
                  }
              }

              fun note(context: Context, tag: String) {
                  runCatching { write(context.applicationContext, tag, Thread.currentThread(), null) }
              }

              private fun folders(context: Context): List<File> {
                  val list = ArrayList<File>()
                  list.add(File(Environment.getExternalStorageDirectory(), FOLDER))
                  context.getExternalFilesDir(null)?.let { list.add(File(it, FOLDER)) }
                  list.add(File(context.filesDir, FOLDER))
                  return list
              }

              private fun write(context: Context, tag: String, thread: Thread, error: Throwable?) {
                  val stamp = SimpleDateFormat("yyyyMMdd-HHmmss", Locale.US).format(Date())
                  val body = buildString {
                      appendLine("time: " + stamp)
                      appendLine("tag: " + tag)
                      appendLine("thread: " + thread.name)
                      appendLine("version: " + com.lagradost.cloudstream3.BuildConfig.VERSION_NAME)
                      appendLine("sdk: " + Build.VERSION.SDK_INT)
                      if (error != null) {
                          val buffer = StringWriter()
                          error.printStackTrace(PrintWriter(buffer))
                          appendLine()
                          append(buffer.toString())
                      }
                  }
                  for (folder in folders(context)) {
                      runCatching {
                          if (!folder.exists()) folder.mkdirs()
                          File(folder, tag + "-" + stamp + ".txt").writeText(body)
                      }
                  }
              }
          }
          """, encoding="utf-8")
          print("PbCrashLogger.kt written")

          main = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/MainActivity.kt")
          text = main.read_text(encoding="utf-8")
          anchor = "        CommonActivity.init(this)\\n"
          if "PbCrashLogger" not in text and anchor in text:
              text = text.replace(
                  anchor,
                  anchor
                  + "        runCatching { com.lagradost.cloudstream3.ui.pb.PbCrashLogger.install(this) }\\n"
                  + "        runCatching { com.lagradost.cloudstream3.ui.pb.PbCrashLogger.ensureAccess(this) }\\n",
                  1,
              )
          for call in (
              "com.lagradost.cloudstream3.ui.pb.PbPreinstalled.seed(this)",
              "com.lagradost.cloudstream3.ui.pb.PbUpdater.checkAndOffer(this)",
          ):
              if "        " + call + "\\n" in text:
                  text = text.replace(
                      "        " + call + "\\n",
                      "        runCatching { " + call + " }\\n",
                      1,
                  )
          if "setupFloatingNavBar(navController)" in text and "runCatching { setupFloatingNavBar" not in text:
              text = text.replace(
                  "        setupFloatingNavBar(navController)\\n",
                  "        runCatching { setupFloatingNavBar(navController) }\\n",
                  1,
              )
          # a marker once the activity has finished starting, to see how far it gets
          if "pb-activity-created" not in text:
              text = text.replace(
                  "        runCatching { com.lagradost.cloudstream3.ui.pb.PbCrashLogger.install(this) }\\n",
                  "        runCatching { com.lagradost.cloudstream3.ui.pb.PbCrashLogger.install(this) }\\n"
                  "        runCatching { com.lagradost.cloudstream3.ui.pb.PbCrashLogger.note(this, \"pb-activity-created\") }\\n",
                  1,
              )
          main.write_text(text, encoding="utf-8")
          print("MainActivity.kt guarded and marked")

          manifest = pathlib.Path("app/src/main/AndroidManifest.xml")
          mtext = manifest.read_text(encoding="utf-8")
          if "MANAGE_EXTERNAL_STORAGE" not in mtext:
              perm = ('    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"\\n'
                      '        tools:ignore="ScopedStorage" />\\n')
              mtext = mtext.replace("<application", perm + "\\n    <application", 1)
          if "WRITE_EXTERNAL_STORAGE" not in mtext:
              perm2 = ('    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\\n'
                       '        android:maxSdkVersion="28" />\\n')
              mtext = mtext.replace("<application", perm2 + "\\n    <application", 1)
          if "xmlns:tools" not in mtext.split("<application")[0]:
              mtext = mtext.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\\n    xmlns:tools="http://schemas.android.com/tools"',
                  1,
              )
          manifest.write_text(mtext, encoding="utf-8")
          print("manifest: storage permissions added")
          PYEOF

      - name: Disable automatic update downloads
        # An update may only start when the user taps Download. The stock
        # CloudStream auto-updater is switched off so nothing downloads by itself.
        working-directory: src
        run: |
          python3 <<'PYEOF'
          import pathlib

          updater = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/utils/InAppUpdater.kt")
          text = updater.read_text(encoding="utf-8")
          old = "        if (checkAutoUpdate && !autoUpdateEnabled) {\n            return false\n        }\n"
          new = ("        // Prime Box: an automatic check must never download anything.\n"
                 "        if (checkAutoUpdate) {\n            return false\n        }\n")
          if old in text and "an automatic check must never download" not in text:
              updater.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("InAppUpdater.kt: automatic updates disabled")
          else:
              print("InAppUpdater.kt: already guarded or pattern missing")

          pref = pathlib.Path("shared/src/commonMain/kotlin/com/lagradost/cloudstream4/DevicePreferenceStore.kt")
          ptext = pref.read_text(encoding="utf-8")
          old_pref = 'val showAppUpdates = preferences.getBoolean("auto_update", true)'
          new_pref = 'val showAppUpdates = preferences.getBoolean("auto_update", false)'
          if old_pref in ptext:
              pref.write_text(ptext.replace(old_pref, new_pref, 1), encoding="utf-8")
              print("DevicePreferenceStore.kt: app update prompts default to off")
          PYEOF

      - name: Fix duplicate attributes in the archive
        # activity_main.xml declares android:visibility twice on the BottomNavigationView,
        # which aapt rejects. Collapse consecutive duplicates so the archive builds.
        working-directory: src
        run: |
          python3 <<'PYEOF'
          import pathlib, re

          layout = pathlib.Path("app/src/main/res/layout/activity_main.xml")
          text = layout.read_text(encoding="utf-8")
          before = text
          # collapse two identical android:visibility lines that sit back to back
          text = re.sub(
              r'(\n[ \t]*android:visibility="[a-z]+")(\n[ \t]*android:visibility="[a-z]+")+',
              r'\1',
              text,
          )
          if text != before:
              layout.write_text(text, encoding="utf-8")
              print("activity_main.xml: duplicate android:visibility removed")
          else:
              print("activity_main.xml: nothing to change")
          PYEOF

      - name: Fix the remaining compile errors in this archive
        working-directory: src
        run: |
          python3 <<'PYEOF'
          import pathlib

          # 1. the sheet layout lost its two buttons, but PbUpdater still looks them up
          layout = pathlib.Path("app/src/main/res/layout/pb_update_dialog.xml")
          text = layout.read_text(encoding="utf-8")
          if "pb_update_action" not in text:
              buttons = (
                  '\n        <com.google.android.material.button.MaterialButton\n'
                  '            android:id="@+id/pb_update_action"\n'
                  '            android:layout_width="match_parent"\n'
                  '            android:layout_height="wrap_content"\n'
                  '            android:layout_marginTop="18dp"\n'
                  '            android:visibility="gone"\n'
                  '            android:text="Download"\n'
                  '            app:backgroundTint="#FFFFFF"\n'
                  '            app:cornerRadius="24dp" />\n'
                  '\n        <com.google.android.material.button.MaterialButton\n'
                  '            android:id="@+id/pb_update_dismiss"\n'
                  '            android:layout_width="match_parent"\n'
                  '            android:layout_height="wrap_content"\n'
                  '            android:layout_marginTop="8dp"\n'
                  '            android:visibility="gone"\n'
                  '            android:text="Maybe later"\n'
                  '            app:backgroundTint="#2A2624"\n'
                  '            app:cornerRadius="24dp" />\n'
              )
              idx = text.rfind("</LinearLayout>")
              if idx != -1:
                  text = text[:idx] + buttons + text[idx:]
                  layout.write_text(text, encoding="utf-8")
                  print("pb_update_dialog.xml: action and dismiss buttons restored")

          # 2. the backup path is nullable, so ifBlank cannot be called on it directly
          settings = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/settings/PrimeBoxSettingsExtraFragments.kt")
          st = settings.read_text(encoding="utf-8")
          old_path = 'SettingText("Backup location", path.ifBlank { "Default app backup location" })'
          new_path = 'SettingText("Backup location", (path ?: "").ifBlank { "Default app backup location" })'
          if old_path in st:
              st = st.replace(old_path, new_path, 1)
              print("PrimeBoxSettingsExtraFragments.kt: nullable backup path fixed")

          # 3. the file uses `by` delegation but never imports the delegates
          if "import androidx.compose.runtime.getValue" not in st:
              st = st.replace(
                  "import androidx.compose.runtime.Composable",
                  "import androidx.compose.runtime.Composable\n"
                  "import androidx.compose.runtime.getValue\n"
                  "import androidx.compose.runtime.setValue",
                  1,
              )
              print("PrimeBoxSettingsExtraFragments.kt: compose delegate imports added")

          # 4. the settings screen needs the same cast
          sfs = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/settings/SettingsFragmentScreen.kt")
          st2 = sfs.read_text(encoding="utf-8")
          if "activity?.onBackPressedDispatcher" in st2:
              st2 = st2.replace(
                  "activity?.onBackPressedDispatcher?.onBackPressed()",
                  "(activity as? androidx.activity.ComponentActivity)?.onBackPressedDispatcher?.onBackPressed()",
              )
              print("SettingsFragmentScreen.kt: back press cast added")

          # 5. SettingsSearch went missing but two screens still call it
          if "fun SettingsSearch(" not in st2:
              helper = (
                  "\n    @Composable\n"
                  "    fun SettingsSearch(textState: androidx.compose.foundation.text.input.TextFieldState) {\n"
                  "        androidx.compose.material3.OutlinedTextField(\n"
                  "            value = textState.text.toString(),\n"
                  "            onValueChange = { updated ->\n"
                  "                textState.edit { replace(0, length, updated) }\n"
                  "            },\n"
                  "            modifier = androidx.compose.ui.Modifier.fillMaxWidth(),\n"
                  "            placeholder = { androidx.compose.material3.Text(\"Search\") },\n"
                  "            singleLine = true,\n"
                  "        )\n"
                  "    }\n"
              )
              idx = st2.rstrip().rfind("}")
              if idx != -1:
                  st2 = st2[:idx] + helper + st2[idx:]
                  print("SettingsFragmentScreen.kt: SettingsSearch restored")
          sfs.write_text(st2, encoding="utf-8")

          # 6. LocalActivity is an Activity, so the dispatcher needs a ComponentActivity
          old_back = "activity?.onBackPressedDispatcher?.onBackPressed()"
          new_back = "(activity as? androidx.activity.ComponentActivity)?.onBackPressedDispatcher?.onBackPressed()"
          if old_back in st:
              st = st.replace(old_back, new_back, 1)
              print("PrimeBoxSettingsExtraFragments.kt: back press cast added")
          settings.write_text(st, encoding="utf-8")
          PYEOF

      - name: Fix colours, the bottom band and the status bar overlap
        working-directory: src
        run: |
          python3 <<'PYEOF'
          import pathlib

          # 1. FollowSystem used the light scheme on light devices, so text went black on the
          #    dark Prime Box background. Keep the app on the dark scheme unless picked manually.
          theme = pathlib.Path("shared/src/commonMain/kotlin/com/lagradost/cloudstream4/theme/Theme.kt")
          t = theme.read_text(encoding="utf-8")
          old = "CloudStreamThemeMode.FollowSystem -> if (systemDark) darkScheme() else lightScheme()"
          new = "CloudStreamThemeMode.FollowSystem -> darkScheme()"
          if old in t:
              theme.write_text(t.replace(old, new, 1), encoding="utf-8")
              print("Theme.kt: FollowSystem resolves to the dark scheme")

          # 2. the settings screen drew its own dark surfaces but inherited light-scheme text
          sfs = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/settings/SettingsFragmentScreen.kt")
          st = sfs.read_text(encoding="utf-8")
          if "statusBarsPadding" not in st:
              st = st.replace(
                  "import androidx.compose.foundation.layout.navigationBarsPadding",
                  "import androidx.compose.foundation.layout.navigationBarsPadding\n"
                  "import androidx.compose.foundation.layout.statusBarsPadding",
                  1,
              )
              st = st.replace(".navigationBarsPadding()", ".statusBarsPadding()\n                .navigationBarsPadding()", 1)
              print("SettingsFragmentScreen.kt: status bar padding added")
          if 'Text(title, style = MaterialTheme.typography.titleMedium)' in st:
              st = st.replace(
                  'Text(title, style = MaterialTheme.typography.titleMedium)',
                  'Text(title, style = MaterialTheme.typography.titleMedium, color = Color.White)',
                  1,
              )
              print("SettingsFragmentScreen.kt: section titles are white")
          if 'text = "Settings",' in st and 'color = Color.White' not in st.split('text = "Settings",')[1][:200]:
              st = st.replace(
                  'text = "Settings",\n                    style = MaterialTheme.typography.titleLarge,',
                  'text = "Settings",\n                    style = MaterialTheme.typography.titleLarge,\n                    color = Color.White,',
                  1,
              )
              print("SettingsFragmentScreen.kt: top bar title is white")
          sfs.write_text(st, encoding="utf-8")

          # 3. the floating bar sits on a transparent strip so the content shows behind it
          layout = pathlib.Path("app/src/main/res/layout/activity_main.xml")
          lt = layout.read_text(encoding="utf-8")
          if "pb_nav_bar" in lt and "android:background=\"@android:color/transparent\"" not in lt.split("pb_nav_bar")[1][:400]:
              lt = lt.replace(
                  'android:id="@+id/pb_nav_bar"',
                  'android:id="@+id/pb_nav_bar"\n            android:background="@android:color/transparent"',
                  1,
              )
              layout.write_text(lt, encoding="utf-8")
              print("activity_main.xml: floating bar strip is transparent")
          PYEOF

      - name: Keep downloads inside the app
        working-directory: src
        run: |
          python3 - <<'PYEOF'
          import pathlib, re
          path = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/utils/downloader/DownloadFileManagement.kt")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r"fun getDefaultDir\(context: Context\): SafeFile\? \{.*?\n    \}", re.S)
          replacement = (
              "fun getDefaultDir(context: Context): SafeFile? {\n"
              "        // keep downloads in the app folder; the public MediaStore folder created\n"
              "        // a new numbered directory for every attempt and never completed\n"
              "        val dir = java.io.File(context.getExternalFilesDir(null), \"downloads\")\n"
              "        if (!dir.exists()) dir.mkdirs()\n"
              "        return SafeFile.fromFile(context, dir)\n"
              "    }"
          )
          if "getExternalFilesDir(null), \"downloads\"" in text:
              print("download dir already points inside the app")
          elif pattern.search(text):
              path.write_text(pattern.sub(lambda m: replacement, text, count=1), encoding="utf-8")
              print("DownloadFileManagement.kt: downloads now use the app folder")
          else:
              print("getDefaultDir pattern not found")
          PYEOF

      - name: Transparent logo and no header avatar
        working-directory: src
        run: |
          pip install --quiet pillow
          python3 - <<'PYEOF'
          import pathlib
          from PIL import Image
          logo = pathlib.Path("app/src/main/res/drawable/pb_logo.png")
          im = Image.open(logo).convert("RGBA")
          px = im.load()
          w, h = im.size
          changed = 0
          for y in range(h):
              for x in range(w):
                  r, g, b, a = px[x, y]
                  if a > 0 and r < 40 and g < 40 and b < 40:
                      px[x, y] = (r, g, b, 0)
                      changed += 1
          im.save(logo)
          print("pb_logo.png: cleared", changed, "black pixels")
          head = pathlib.Path("app/src/main/res/layout/fragment_home_head.xml")
          t = head.read_text(encoding="utf-8")
          for pid in ("home_head_profile_padding", "alternate_home_head_profile_padding"):
              needle = 'android:id="@+id/' + pid + '"'
              idx = t.find(needle)
              if idx != -1 and 'android:visibility' not in t[idx:idx + 400]:
                  t = t.replace(needle, needle + '\n                android:visibility="gone"', 1)
          head.write_text(t, encoding="utf-8")
          print("fragment_home_head.xml: header avatar hidden")
          PYEOF

      - name: Pin the search bar and logo to the top
        working-directory: src
        run: |
          python3 - <<'PYEOF'
          import pathlib
          home = pathlib.Path("app/src/main/res/layout/fragment_home.xml")
          t = home.read_text(encoding="utf-8")
          if "pb_fixed_head" not in t:
              include = ('\n    <include\n'
                         '        android:id="@+id/pb_fixed_head"\n'
                         '        layout="@layout/fragment_home_head"\n'
                         '        android:layout_width="match_parent"\n'
                         '        android:layout_height="wrap_content"\n'
                         '        android:layout_gravity="top" />\n')
              idx = t.rfind("</FrameLayout>")
              if idx != -1:
                  t = t[:idx] + include + t[idx:]
                  print("fragment_home.xml: header pinned at the top")
          t = t.replace('android:id="@+id/home_master_recycler"\n        android:layout_width="match_parent"',
                        'android:id="@+id/home_master_recycler"\n        android:layout_width="match_parent"\n        android:paddingTop="64dp"\n        android:clipToPadding="false"',
                        1)
          home.write_text(t, encoding="utf-8")
          adapter = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/home/HomeParentItemAdapterPreview.kt")
          a = adapter.read_text(encoding="utf-8")
          if "override val headers = 1" in a:
              a = a.replace("override val headers = 1", "override val headers = 0", 1)
              adapter.write_text(a, encoding="utf-8")
              print("adapter: header item no longer duplicated in the list")
          PYEOF

      - name: Collapse the header on scroll and drop the profile button
        working-directory: src
        run: |
          python3 - <<'PYEOF'
          import pathlib
          frag = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/home/HomeFragment.kt")
          t = frag.read_text(encoding="utf-8")
          anchor = "            homeSwitchAccount.setOnClickListener {"
          add = ('            binding.root.findViewById<View>(R.id.pb_fixed_head)?.let { head ->\n'
                 '                val sbId = resources.getIdentifier("status_bar_height", "dimen", "android")\n'
                 '                if (sbId > 0) head.setPadding(0, resources.getDimensionPixelSize(sbId), 0, 0)\n'
                 '                binding.homeMasterRecycler.addOnScrollListener(\n'
                 '                    object : androidx.recyclerview.widget.RecyclerView.OnScrollListener() {\n'
                 '                        override fun onScrolled(rv: androidx.recyclerview.widget.RecyclerView, dx: Int, dy: Int) {\n'
                 '                            val offset = rv.computeVerticalScrollOffset().coerceAtLeast(0)\n'
                 '                            val t = (offset / 220f).coerceIn(0f, 1f)\n'
                 '                            head.scaleX = 1f - 0.12f * t\n'
                 '                            head.scaleY = 1f - 0.12f * t\n'
                 '                            head.translationY = -18f * t\n'
                 '                            head.alpha = 1f - 0.12f * t\n'
                 '                        }\n'
                 '                    }\n'
                 '                )\n'
                 '            }\n')
          if "pb_fixed_head" not in t and anchor in t:
              t = t.replace(anchor, add + anchor, 1)
              frag.write_text(t, encoding="utf-8")
              print("HomeFragment.kt: header collapses as the list scrolls")
          else:
              print("HomeFragment.kt: already wired or anchor missing")
          head = pathlib.Path("app/src/main/res/layout/fragment_home_head.xml")
          h = head.read_text(encoding="utf-8")
          for pid in ("home_head_profile_padding", "alternate_home_head_profile_padding"):
              needle = 'android:id="@+id/' + pid + '"'
              idx = h.find(needle)
              if idx != -1 and 'android:visibility' not in h[idx:idx + 400]:
                  h = h.replace(needle, needle + '\n                android:visibility="gone"', 1)
          head.write_text(h, encoding="utf-8")
          print("header profile blocks hidden")
          PYEOF

      - name: Open the player in portrait first
        working-directory: src
        run: |
          python3 - <<'PYEOF'
          import pathlib
          path = pathlib.Path("app/src/main/java/com/lagradost/cloudstream3/ui/player/PlayerView.kt")
          t = path.read_text(encoding="utf-8")
          old = "        return if (autoPlayerRotateEnabled && isVerticalOrientation)\n            ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT\n        else ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE"
          new = "        // Prime Box: start in portrait like YouTube; the fullscreen button switches to landscape.\n        return ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT"
          if old in t:
              path.write_text(t.replace(old, new, 1), encoding="utf-8")
              print("PlayerView.kt: player starts in portrait")
          elif "Prime Box: start in portrait" in t:
              print("PlayerView.kt: already portrait")
          else:
              print("orientation pattern not found")
          PYEOF

      - name: Bump version
        working-directory: src
        run: |
          python3 <<'PYEOF'
          import pathlib, re, os
          path = pathlib.Path("gradle/libs.versions.toml")
          text = path.read_text(encoding="utf-8")
          # bump whatever the archive already carries, so the number keeps rising
          def bump_code(m):
              return 'versionCode = "%d"' % (int(m.group(1)) + 1)
          def bump_name(m):
              # the archive is always the same, so add the run number to keep rising
              run = int(os.environ.get("RUN_NUMBER", "0"))
              return 'versionName = "%s.%s.%d"' % (m.group(1), m.group(2), int(m.group(3)) + 1 + run)
          text = re.sub(r'^versionCode = "(\d+)"$', bump_code, text, count=1, flags=re.M)
          text = re.sub(r'^versionName = "(\d+)\.(\d+)\.(\d+)"$', bump_name, text, count=1, flags=re.M)
          path.write_text(text, encoding="utf-8")
          print("bumped to:")
          print("\n".join(l for l in text.splitlines() if l.startswith(("versionCode", "versionName"))))
          PYEOF
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Build stable release APK
        working-directory: src
        run: ./gradlew :app:assembleStableRelease --no-daemon --stacktrace

      - name: Collect APK
        working-directory: src
        run: |
          set -euo pipefail
          find app/build/outputs -name '*.apk' -print
          APK="$(find app/build/outputs -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          cp "$APK" "$RUNNER_TEMP/primebox-unsigned.apk"

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/primebox.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$SECRET_STORE_PASS" \
            --key-pass "pass:$SECRET_KEY_PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$RUNNER_TEMP/PrimeBox-signed.apk" "$RUNNER_TEMP/primebox-unsigned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/PrimeBox-signed.apk"
          ls -la "$RUNNER_TEMP/PrimeBox-signed.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeBox-uploaded-source
          path: ${{ runner.temp }}/PrimeBox-signed.apk
          if-no-files-found: error
          retention-days: 14
